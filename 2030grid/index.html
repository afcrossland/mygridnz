<script>
(async () => { try {
  // Static data served from the repo (pushed from Google Sheets by app-scripts/GitHub_push.gs).
  const DATA          = 'https://nz.future-zero.com/data';
  const MIX_URL        = `${DATA}/2030-mix.json`;
  const TIMESERIES_URL = `${DATA}/2030-timeseries.json`;
  const CURTAIL_URL    = `${DATA}/2030-curtailment.json`;

  const FONT = "'DM Sans', 'Segoe UI', Arial, sans-serif";

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Sheet 1 (mix) columns: Label(0), Hydro(1), Geothermal(2), Wind(3), Solar(4), Wood(5), Gas(6), Storage(7), Coal(8), Diesel(9)
  const MIX_SOURCES = [
    { label: 'Hydro',      col: 1, color: '#2563eb', carbon: 24,  lowCarbon: true,  renewable: true  },
    { label: 'Geothermal', col: 2, color: '#dc2626', carbon: 38,  lowCarbon: true,  renewable: true  },
    { label: 'Wind',       col: 3, color: '#0d9e6e', carbon: 12,  lowCarbon: true,  renewable: true  },
    { label: 'Solar',      col: 4, color: '#facc15', carbon: 41,  lowCarbon: true,  renewable: true  },
    { label: 'Wood',       col: 5, color: '#78350f', carbon: 230, lowCarbon: true,  renewable: false },
    { label: 'Gas',        col: 6, color: '#475569', carbon: 490, lowCarbon: false, renewable: false },
    { label: 'Storage',    col: 7, color: '#ea580c', carbon: 0,   lowCarbon: true,  renewable: false },
    { label: 'Coal',       col: 8, color: '#0f172a', carbon: 820, lowCarbon: false, renewable: false },
    { label: 'Diesel',     col: 9, color: '#94a3b8', carbon: 650, lowCarbon: false, renewable: false },
  ];

  // Sheet 2 (timeseries) columns: Date(0), Hour(1), Geothermal(2), Solar(3), Wind(4), Storage(5), Hydro(6), Wood(7), Gas(8), Diesel(9), Other(10)
  // Values are in MW; divided by 1000 → GW when building datasets
  // Plot order = stacking order (bottom to top)
  const TIME_SOURCES = [
    { label: 'Geothermal', col: 2, color: '#dc2626' },
    { label: 'Wind',       col: 4, color: '#0d9e6e' },
    { label: 'Solar',      col: 3, color: '#facc15' },
    { label: 'Hydro',      col: 6, color: '#2563eb' },
    { label: 'Wood',       col: 7, color: '#78350f' },
    { label: 'Storage',    col: 5, color: '#ea580c' },
    { label: 'Gas',        col: 8, color: '#475569' },
    { label: 'Diesel',     col: 9, color: '#94a3b8' },
  ];

  async function fetchTable(url) {
    const r = await fetch(url);
    const t = await r.text();
    return JSON.parse(t.slice(t.indexOf('(') + 1, t.lastIndexOf(')'))).table;
  }

  function parseGDate(v) {
    const m = String(v).match(/Date\((\d+),(\d+),(\d+)/);
    return m ? new Date(+m[1], +m[2], +m[3]) : null;
  }

  function fmtDate(d) {
    return d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  // ── LCOE per source (NZD/MWh, approximate 2024 NZ values) ──
  // LCOE = lifetime cost to build + run ÷ lifetime output. Answers: "what price does each plant need to break even?"
  // These are NZD values based on NZ-specific conditions (amortised hydro fleet, NZ wind/solar resources, NZ labour costs).
  const LCOE_RATES = {
    Hydro:         40,   // Existing fleet — fully amortised, O&M only (~$30–50/MWh)
    Geothermal:    85,   // Well maintenance + O&M (Contact/Mercury fleet, ~$60–90/MWh)
    Wind:          95,   // Onshore NZ new build (Tilt/Mercury, ~$80–110/MWh)
    Solar:         90,   // Utility-scale NZ new build (~$75–100/MWh)
    Wood:         150,   // Biomass including fuel cost
    Storage:      160,   // Grid-scale BESS capital + O&M (imported battery, NZ install)
    Coal:         260,   // Fuel + ETS carbon cost (~$60/t CO₂)
    Diesel:       350,   // Peaking diesel, high fuel cost
  };

  // ── Marginal cost per source (NZD/MWh, short-run variable cost only) ──
  // The marginal generator (last one dispatched) sets the wholesale price paid to all generators.
  // More renewables → gas rarely dispatched → lower wholesale price → lower bills.
  const MARGINAL_COSTS = {
    Solar:         0,    // zero fuel cost
    Wind:          5,    // near-zero variable O&M
    Hydro:         5,    // near-zero (water has opportunity cost but negligible variable cost)
    Storage:      20,    // roundtrip efficiency loss
    Geothermal:   25,    // variable O&M (~$15–30/MWh)
    Wood:        100,    // fuel cost
    Coal:         90,    // fuel + ETS (~$60/t CO₂ × ~0.95 t/MWh)
    Gas:         140,    // fuel + ETS (Pohokura/Kupe gas, high & rising)
    Diesel:      220,    // high fuel cost
  };

  function marginalPrice(fd) {
    const active = MIX_SOURCES
      .filter(s => (fd[s.label] ?? 0) > 0)
      .sort((a, b) => (MARGINAL_COSTS[a.label] ?? 0) - (MARGINAL_COSTS[b.label] ?? 0));
    if (!active.length) return 0;
    return MARGINAL_COSTS[active[active.length - 1].label] ?? 0;
  }

  // Gas LCOE is load-factor dependent: low utilisation (peaking) → very high cost per MWh
  // Formula: LCOE = FixedCapital/LF + VariableCost  (NZD/MWh)
  // Mix sheet contains annual GWh totals, so capacity window = 8760 h/year
  const GAS_CAPACITY_GW  = 2.5;    // approximate NZ gas fleet (CCGT + OCGT)
  const GAS_ANNUAL_HOURS = 8760;   // annual hours — mix data is annual GWh totals
  const GAS_LCOE_CAP     = 400;    // NZD/MWh cap for very low load-factor operation

  function gasLcoeFromRow(fd) {
    const gwh = fd['Gas'] ?? 0;
    if (gwh <= 0) return 240;  // fallback: ~15% LF baseline assumption
    // At 30% LF (today ~$175/MWh); at 10% LF (~$305/MWh, capped at $400); at 50% LF (~$150/MWh)
    const lf  = Math.min(1, Math.max(0.01, gwh / (GAS_CAPACITY_GW * GAS_ANNUAL_HOURS)));
    return Math.min(GAS_LCOE_CAP, Math.round(20 / lf + 110));
  }

  // curtailUsefulFrac: fraction of curtailed energy treated as useful output (e.g. 0.5 = 50% used for EVs)
  function calcSystemLCOE(fd, curtailRows, isBlueprint, curtailUsefulFrac = 0) {
    let totalCost = 0, totalGWh = 0;
    const breakdown = [];
    const gasRate = gasLcoeFromRow(fd);
    const rates   = { ...LCOE_RATES, Gas: gasRate };

    // Build curtailment lookup: label → { directFrac, storageFrac, curtailFrac }
    // Mix sheet Wind/Solar in Blueprint = direct delivery only
    // Divide by directFrac to recover total generated (includes via-storage + curtailed)
    const curtailMap = {};
    if (isBlueprint && curtailRows) {
      curtailRows.forEach(r => {
        const label = r.c[0]?.v;
        if (label) curtailMap[label] = {
          directFrac:  r.c[1]?.v ?? 0,
          storageFrac: r.c[2]?.v ?? 0,
          curtailFrac: r.c[3]?.v ?? 0,
        };
      });
    }

    MIX_SOURCES.forEach(src => {
      const directGwh = fd[src.label] ?? 0;
      if (directGwh <= 0) return;
      const rate = rates[src.label] ?? 100;

      const cd = curtailMap[src.label];
      if (cd && cd.directFrac > 0) {
        // Sheet value = direct delivery; scale up to total generated (includes via-storage + curtailed)
        const totalGenerated = directGwh / cd.directFrac;
        const usefulExtra = totalGenerated * cd.curtailFrac * curtailUsefulFrac;
        totalCost += totalGenerated * rate;   // pay for all generated, including curtailed
        totalGWh  += directGwh + usefulExtra; // denominator = direct + any usefully-consumed curtailed
        breakdown.push({ label: src.label, totalGwh: totalGenerated, gwh: directGwh, usefulExtra, rate, hasCurtail: true,
                         storageFrac: cd.storageFrac, curtailFrac: cd.curtailFrac, directFrac: cd.directFrac });
      } else {
        totalCost += directGwh * rate;
        totalGWh  += directGwh;
        breakdown.push({ label: src.label, gwh: directGwh, rate, hasCurtail: false });
      }
    });

    const lcoe = totalGWh > 0 ? Math.round(totalCost / totalGWh) : 0;
    return { lcoe, breakdown, totalGWh };
  }

  function buildLcoeTip(result, label) {
    const { breakdown, totalGWh, lcoe } = result;
    const lines = [`${label}:`];
    breakdown.forEach(b => {
      const sharePct   = totalGWh > 0 ? Math.round(b.gwh / totalGWh * 100) : 0;
      if (b.hasCurtail) {
        const totalGen   = b.totalGwh;
        const contrib    = totalGWh > 0 ? Math.round(totalGen * b.rate / totalGWh) : 0;
        lines.push(`  ${b.label}: ${sharePct}% delivered + ${Math.round(b.storageFrac*100)}% storage + ${Math.round(b.curtailFrac*100)}% curtailed × $${b.rate} = $${contrib}/MWh`);
      } else {
        const contrib = totalGWh > 0 ? Math.round(b.gwh * b.rate / totalGWh) : 0;
        lines.push(`  ${b.label}: ${sharePct}% × $${b.rate} = $${contrib}/MWh`);
      }
    });
    lines.push(`  ──────────────────────`);
    lines.push(`  Total: $${lcoe}/MWh delivered`);
    return lines.join('\n');
  }

  const [mixResult, tsResult, curtailResult] = await Promise.allSettled([
    fetchTable(MIX_URL),
    fetchTable(TIMESERIES_URL),
    fetchTable(CURTAIL_URL),
  ]);

  // ── Mix comparison ────────────────────────────────────────────────
  if (mixResult.status === 'fulfilled') {
    // Sheet is transposed: col 0 = fuel name, col 1 = actual GWh, col 2 = blueprint GWh
    const fuelActual = {}, fuelBlueprint = {};
    mixResult.value.rows.forEach(r => {
      const name = r.c[0]?.v;
      if (name) {
        fuelActual[name]    = r.c[1]?.v ?? 0;
        fuelBlueprint[name] = r.c[2]?.v ?? 0;
      }
    });

    const THERM_EFF = { Gas: 0.57, Geothermal: 0.15, Wood: 0.39, Coal: 0.35, Diesel: 0.35 };

    function calcStats(fd) {
      let total = 0, lowCarbon = 0, renewable = 0, gasGWh = 0, carbonWeighted = 0;
      let thermalInput = 0, thermalLoss = 0;
      MIX_SOURCES.forEach(src => {
        const v = fd[src.label] ?? 0;
        total          += v;
        carbonWeighted += v * src.carbon;
        if (src.lowCarbon)  lowCarbon += v;
        if (src.renewable)  renewable += v;
        if (src.label === 'Gas') gasGWh = v;
        if (THERM_EFF[src.label] && v > 0) {
          thermalInput += v / THERM_EFF[src.label];
          thermalLoss  += v / THERM_EFF[src.label] - v;
        }
      });
      const directGW = total - Object.keys(THERM_EFF).reduce((s, k) => s + (fd[k] ?? 0), 0);
      const totalInput = thermalInput + directGW;
      return {
        total,
        ci:             total > 0 ? Math.round(carbonWeighted / total) : 0,
        lcPct:          total > 0 ? Math.round(lowCarbon / total * 100) : 0,
        renPct:         total > 0 ? Math.round(renewable / total * 100) : 0,
        gasPct:         total > 0 ? Math.round(gasGWh / total * 100) : 0,
        thermalLossPct: totalInput > 0 ? Math.round(thermalLoss / totalInput * 100) : 0,
      };
    }

    const actual    = calcStats(fuelActual);
    const manifesto = calcStats(fuelBlueprint);

    const curtailRows         = (curtailResult.status === 'fulfilled') ? curtailResult.value.rows : [];
    const actualLcoe          = calcSystemLCOE(fuelActual,    curtailRows, false);
    const manifestoLcoe       = calcSystemLCOE(fuelBlueprint, curtailRows, true, 0);
    const manifestoUsefulLcoe = calcSystemLCOE(fuelBlueprint, curtailRows, true, 0.5);

    // Comparison strip
    const stripEl = document.getElementById('compare-strip');
    const mpActual    = marginalPrice(fuelActual);
    const mpBlueprint = marginalPrice(fuelBlueprint);

    const metrics = [
      { label: 'Carbon Intensity', suffix: '<span class="compare-val-sfx"> g/kWh</span>', unit: 'gCO₂eq/kWh',
        now: actual.ci,    after: manifesto.ci,    nowGood: false },
      { label: 'Low Carbon',       suffix: '<span class="compare-val-sfx">%</span>', unit: '% of generation',
        now: actual.lcPct, after: manifesto.lcPct, nowGood: actual.lcPct > 60 },
      { label: 'Renewables',       suffix: '<span class="compare-val-sfx">%</span>', unit: '% of generation',
        now: actual.renPct, after: manifesto.renPct, nowGood: actual.renPct > 50 },
      { label: 'Gas',              suffix: '<span class="compare-val-sfx">%</span>', unit: '% of generation',
        now: actual.gasPct, after: manifesto.gasPct, nowGood: false },
      { label: 'Thermal Losses',   suffix: '<span class="compare-val-sfx">%</span>', unit: '% of input energy',
        now: actual.thermalLossPct, after: manifesto.thermalLossPct, nowGood: false },
    ];

    metrics.forEach(m => {
      const pre = m.prefix ?? '';
      stripEl.insertAdjacentHTML('beforeend', `
        <div class="compare-card">
          <div class="compare-card-label">${m.label}</div>
          <div class="compare-values">
            <span class="compare-val compare-val--manifesto">${pre}${m.after}${m.suffix}</span>
          </div>
          <div class="compare-was">was ${pre}${m.now}</div>
          <div class="compare-unit">${m.unit}</div>
        </div>`);
    });

    // LCOE 3-stage card
    const lcoeEl = document.getElementById('lcoe-card');
    if (lcoeEl) {
      lcoeEl.innerHTML = `
        <div class="compare-card-label">True system cost — what does it actually cost to build and run this mix? <a href="/about/index.html#lcoe-methodology" style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--brand);margin-left:6px;">methodology ↗</a></div>
        <div class="lcoe-stages">
          <div class="lcoe-stage">
            <div class="compare-val compare-val--now">$${actualLcoe.lcoe}<span class="compare-val-sfx">/MWh</span></div>
            <div class="lcoe-stage-label">Today's mix</div>
          </div>
          <span class="compare-arrow-sym">→</span>
          <div class="lcoe-stage">
            <div class="compare-val compare-val--lcoe-mid">$${manifestoLcoe.lcoe}<span class="compare-val-sfx">/MWh</span></div>
            <div class="lcoe-stage-label">Blueprint</div>
          </div>
        </div>
        <div class="compare-unit" style="margin-top:10px">This is the <strong>Levelised Cost of Energy (LCOE)</strong> — the lifetime build-and-run cost per MWh for each power station, weighted by how much each generates. NZ's large amortised hydro fleet keeps this below the market wholesale price. Expected range: $65–100/MWh.</div>`;
    }

    // Marginal price card
    const marginalEl = document.getElementById('marginal-card');
    if (marginalEl) {
      marginalEl.innerHTML = `
        <div class="compare-card-label">Wholesale electricity price — what generators actually get paid</div>
        <div class="lcoe-stages">
          <div class="lcoe-stage">
            <div class="compare-val compare-val--now">$${mpActual}<span class="compare-val-sfx">/MWh</span></div>
            <div class="lcoe-stage-label">Today's mix</div>
          </div>
          <span class="compare-arrow-sym">→</span>
          <div class="lcoe-stage">
            <div class="compare-val compare-val--manifesto">$${mpBlueprint}<span class="compare-val-sfx">/MWh</span></div>
            <div class="lcoe-stage-label">Blueprint</div>
          </div>
        </div>
        <div class="compare-unit" style="margin-top:10px">Electricity markets use <strong>marginal pricing</strong> — the most expensive generator dispatched at any moment sets the spot price paid to <em>all</em> generators. Today that is usually gas (~$140/MWh variable cost), pushing prices up for everyone. In the Blueprint, gas is rarely needed, so geothermal or storage sets the price instead (~$20–25/MWh variable cost). A low wholesale price here means generators earn less per MWh — it is not the same as LCOE (which covers full capital + running costs).</div>`;
    }

    // Helper: build sorted fuel list + pie data from a fuel data object
    function buildMixData(fd) {
      const entries = MIX_SOURCES
        .map(src => ({ label: src.label, color: src.color, value: fd[src.label] ?? 0 }))
        .filter(e => e.value > 0)
        .sort((a, b) => b.value - a.value);
      const total = entries.reduce((s, e) => s + e.value, 0);
      return { entries, total };
    }

    function buildPie(canvasId, listId, fd) {
      const { entries, total } = buildMixData(fd);

      new Chart(document.getElementById(canvasId), {
        type: 'pie',
        data: {
          labels: entries.map(e => e.label),
          datasets: [{ data: entries.map(e => e.value), backgroundColor: entries.map(e => e.color), borderColor: '#fff', borderWidth: 2, hoverOffset: 6 }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const pct  = Math.round(ctx.parsed / total * 100);
                  const lcoe = LCOE_RATES[ctx.label];
                  const lcoeStr = lcoe != null ? ` | $${lcoe}/MWh` : '';
                  return ` ${ctx.label}: ${pct}%${lcoeStr}`;
                }
              }
            }
          }
        }
      });

      const listEl = document.getElementById(listId);
      entries.forEach(({ label, color, value }) => {
        const pct = total > 0 ? Math.round(value / total * 100) : 0;
        listEl.insertAdjacentHTML('beforeend', `
          <div class="fuel-row">
            <span class="fuel-dot" style="background:${color}"></span>
            <span class="fuel-gw">${(value / 1000).toFixed(1)} TWh</span>
            <span class="fuel-name">${label}</span>
            <div class="fuel-bar-wrap"><div class="fuel-bar" style="width:${pct}%;background:${color}"></div></div>
            <span class="fuel-pct">${pct}%</span>
          </div>`);
      });
    }

    buildPie('pie-actual',    'fuel-actual',    fuelActual);
    buildPie('pie-manifesto', 'fuel-manifesto', fuelBlueprint);
  }

  // ── Timeseries ────────────────────────────────────────────────────
  if (tsResult.status === 'rejected') {
    document.getElementById('timeseries-chart').closest('div').innerHTML =
      '<p style="color:var(--muted);font-size:13px;padding:12px 0;">Live data is temporarily unavailable. Check back shortly.</p>';
    document.getElementById('ts-filter').style.visibility = 'hidden';
  } else if (tsResult.status === 'fulfilled') {
    const allRows = tsResult.value.rows.filter(r => r.c.slice(1).some(c => c && c.v != null));
    const hasCurtail = false; // sheet has no curtailment column

    function buildShowLabelAt(filteredLabels, hours) {
      const set = new Set();
      if (hours === 48) {
        filteredLabels.forEach((_, idx) => { if (idx % 12 === 0) set.add(idx); });
      } else if (hours === 168) {
        let last = '';
        filteredLabels.forEach((lbl, idx) => { if (lbl !== last) { last = lbl; set.add(idx); } });
      } else {
        let dayCount = 0, last = '';
        filteredLabels.forEach((lbl, idx) => {
          if (lbl !== last) { last = lbl; dayCount++; if (dayCount % 3 === 1) set.add(idx); }
        });
      }
      return set;
    }

    function buildDatasets(rows) {
      const ds = TIME_SOURCES.map(src => ({
        label: src.label,
        data: rows.map(r => r.c[src.col]?.v != null ? r.c[src.col].v / 1000 : null),
        backgroundColor: src.color,
        borderColor: src.color,
        borderWidth: 0.5,
        fill: true,
        pointRadius: 0,
        tension: 0.2,
        stack: 'sources',
      }));
      if (hasCurtail) {
        ds.push({
          label: 'Curtailment',
          data: rows.map(r => r.c[8]?.v ?? null),
          borderColor: '#dc2626',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [6, 4],
          fill: false,
          pointRadius: 0,
          tension: 0.2,
          stack: 'curtail',  // own group → renders at absolute value, not stacked with sources
        });
      }
      return ds;
    }

    const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function aggregateMonthly(rows) {
      const monthMap = new Map();
      rows.forEach(r => {
        const d = parseGDate(r.c[0]?.v);
        if (!d) return;
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const lbl = MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
        if (!monthMap.has(key)) monthMap.set(key, { lbl, count: 0, totals: {} });
        const m = monthMap.get(key);
        m.count++;
        TIME_SOURCES.forEach(src => { m.totals[src.col] = (m.totals[src.col] || 0) + (r.c[src.col]?.v ?? 0); });
      });
      const syntheticRows = [], syntheticLabels = [];
      monthMap.forEach(m => {
        syntheticLabels.push(m.lbl);
        const c = {};
        TIME_SOURCES.forEach(src => { c[src.col] = { v: m.count > 0 ? m.totals[src.col] / m.count : 0 }; });
        syntheticRows.push({ c });
      });
      return { rows: syntheticRows, labels: syntheticLabels };
    }

    function rowDateLabel(r) {
      const d = parseGDate(r.c[0]?.v);
      return d ? fmtDate(d) : String(r.c[0]?.v ?? '');
    }

    function buildBarDatasets(rows) {
      return TIME_SOURCES.map(src => ({
        label: src.label,
        data: rows.map(r => r.c[src.col]?.v != null ? r.c[src.col].v / 1000 : null),
        backgroundColor: src.color,
        borderWidth: 0,
        stack: 'sources',
      }));
    }

    const SHARED_OPTIONS = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { font: { family: FONT, size: 12 }, padding: 14, usePointStyle: true, pointStyle: 'circle', boxWidth: 10, boxHeight: 10 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) + ' GW' : '—'}` } }
      },
      scales: {
        x: { stacked: true, ticks: { font: { family: FONT, size: 10 }, maxRotation: 45, minRotation: 0, autoSkip: false }, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, min: 0, title: { display: true, text: 'Power, GW', font: { family: FONT, size: 12 }, color: '#555' }, ticks: { font: { family: FONT, size: 11 } }, grid: { color: '#eeeeee' } }
      }
    };

    let tsChart = null;
    function makeTsChart(type, labels, datasets, xTickCallback) {
      if (tsChart) tsChart.destroy();
      const opts = JSON.parse(JSON.stringify(SHARED_OPTIONS));
      opts.scales.x.ticks.callback = xTickCallback;
      tsChart = new Chart(document.getElementById('timeseries-chart'), { type, data: { labels, datasets }, options: opts });
    }

    // ── Prev / next state ────────────────────────────────────────
    let currentHours  = window.innerWidth < 768 ? 168 : 672;
    let currentOffset = 0; // rows from the end of allRows

    const prevBtn = document.getElementById('ts-prev');
    const nextBtn = document.getElementById('ts-next');

    function syncNavButtons() {
      prevBtn.disabled = currentOffset + currentHours >= allRows.length;
      nextBtn.disabled = currentOffset <= 0;
    }

    function showHourly(hours, offset) {
      currentHours  = hours;
      currentOffset = offset;
      const end   = allRows.length - offset;
      const rows  = allRows.slice(Math.max(0, end - hours), end);
      const lbls  = rows.map(rowDateLabel);
      const showAt = buildShowLabelAt(lbls, hours);
      makeTsChart('line', lbls, buildDatasets(rows), (_, idx) => showAt.has(idx) ? lbls[idx] : '');
      prevBtn.style.visibility = '';
      nextBtn.style.visibility = '';
      syncNavButtons();
    }

    // Find offset to most-recent row that actually has generation data
    // (guards against sheet having trailing empty/null rows)
    function latestDataOffset(hours) {
      for (let i = allRows.length - 1; i >= 0; i--) {
        if (TIME_SOURCES.some(s => (allRows[i].c[s.col]?.v ?? 0) > 0.01)) {
          return Math.max(0, allRows.length - i - 1);
        }
      }
      return 0;
    }

    // Initial render
    document.querySelectorAll('#ts-filter .filter-btn').forEach(b => {
      b.classList.toggle('active', !!b.dataset.hours && parseInt(b.dataset.hours) === currentHours);
    });
    showHourly(currentHours, latestDataOffset(currentHours));

    // Period filter buttons
    document.getElementById('ts-filter').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn || btn.id === 'ts-prev' || btn.id === 'ts-next') return;
      document.querySelectorAll('#ts-filter .filter-btn:not(#ts-prev):not(#ts-next)').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (btn.dataset.mode === 'monthly') {
        const { rows: mRows, labels: mLabels } = aggregateMonthly(allRows);
        makeTsChart('bar', mLabels, buildBarDatasets(mRows), (_, idx) => mLabels[idx]);
        prevBtn.style.visibility = 'hidden';
        nextBtn.style.visibility = 'hidden';
      } else {
        const hrs = parseInt(btn.dataset.hours, 10);
        showHourly(hrs, latestDataOffset(hrs));
      }
    });

    // Prev / next navigation
    prevBtn.addEventListener('click', () => {
      showHourly(currentHours, Math.min(currentOffset + currentHours, allRows.length - currentHours));
    });
    nextBtn.addEventListener('click', () => {
      showHourly(currentHours, Math.max(0, currentOffset - currentHours));
    });
  } // end tsResult.status === 'fulfilled'

  // ── Curtailment ───────────────────────────────────────────────────
  if (curtailResult.status === 'rejected') {
    document.getElementById('curtailment-chart').closest('div').innerHTML =
      '<p style="color:var(--muted);font-size:13px;padding:12px 0;">Curtailment data is temporarily unavailable.</p>';
  } else if (curtailResult.status === 'fulfilled') {
    const rows = curtailResult.value.rows.filter(r => r.c[0]?.v != null);
    const labels = rows.map(r => r.c[0].v);

    new Chart(document.getElementById('curtailment-chart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Delivered direct',  data: rows.map(r => r.c[1]?.v ?? 0), backgroundColor: '#4ade80' },
          { label: 'Via storage',       data: rows.map(r => r.c[2]?.v ?? 0), backgroundColor: '#f96c00' },
          { label: 'Curtailed',         data: rows.map(r => r.c[3]?.v ?? 0), backgroundColor: '#e2e8f0' },
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: { font: { family: FONT, size: 12 }, padding: 14, usePointStyle: true, pointStyle: 'circle', boxWidth: 10, boxHeight: 10 }
          },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${(ctx.parsed.x * 100).toFixed(1)}%` } }
        },
        scales: {
          x: {
            stacked: true, min: 0, max: 1,
            ticks: { font: { family: FONT, size: 11 }, callback: v => Math.round(v * 100) + '%' },
            grid: { color: '#eeeeee' }
          },
          y: {
            stacked: true,
            ticks: { font: { family: FONT, size: 12 } },
            grid: { display: false }
          }
        }
      }
    });
  } // end curtailResult.status === 'fulfilled'
} finally { document.querySelectorAll('.chart-spinner').forEach(el => el.remove()); }
})();

// Auto-open "How it works" section when linked via #how-it-works
if (location.hash === '#how-it-works') {
  const el = document.getElementById('how-it-works');
  if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
</script>

</body>
</html>
