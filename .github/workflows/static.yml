# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Because the site is a data mirror where every commit supersedes the
# previous one (the app script commits data/*.json frequently), cancel superseded in-progress/queued
# runs instead of letting them pile up and collide on the Pages backend ("Deployment failed, try
# again later"). The latest commit always wins, so cancelling older deploys loses nothing.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job: uploads the site as the github-pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

  # Deploy job: only consumes the artifact, so re-running it never uploads a
  # second "github-pages" artifact (the cause of the duplicate-artifact error).
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
