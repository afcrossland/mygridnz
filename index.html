<script>
(async () => { try {
  // Static data served from the repo (pushed from Google Sheets by app-scripts/GitHub_push.gs).
  const DATA        = 'https://nz.future-zero.com/data';
  const MONTHLY_URL = `${DATA}/monthly.json`;
  const ANNUAL_URL  = `${DATA}/annual.json`;
  const LIVE_URL    = `${DATA}/live.json`;
  const FONT = "'DM Sans','Segoe UI',Arial,sans-serif";
  const MONTHS_LBL = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const FUELS  = ['Hydro','Geothermal','Gas','Wind','Solar','Wood','Coal','Diesel'];
  const MC     = { Hydro:2, Geothermal:3, Gas:4, Wind:5, Solar:6, Wood:7, Coal:8, Diesel:9, Other:10, Total:11 };
  const TP_COL = { Hydro:3, Geothermal:4, Gas:5, Wind:6, Solar:7, Wood:8, Coal:9, Diesel:10, Other:11, Total:12 };

  const PALETTE = {
    Hydro:'#2563eb', Geothermal:'#dc2626', Gas:'#475569', Wind:'#0d9e6e',
    Solar:'#facc15', Wood:'#78350f', Coal:'#0f172a', Diesel:'#94a3b8', Other:'#cbd5e1',
  };
  const CARBON_FACTORS = {
    Hydro:24, Geothermal:38, Gas:490, Wind:12, Solar:41, Wood:230, Coal:820, Diesel:650, Other:200,
  };
  const LOW_CARBON = new Set(['Hydro','Geothermal','Wind','Solar','Wood']);
  const RENEWABLE  = new Set(['Hydro','Geothermal','Wind','Solar']);

  async function fetchSheet(url) {
    const t = await (await fetch(url)).text();
    return JSON.parse(t.slice(t.indexOf('(')+1, t.lastIndexOf(')'))).table;
  }

  const [monthlyResult, annualResult, liveResult] = await Promise.allSettled([
    fetchSheet(MONTHLY_URL),
    fetchSheet(ANNUAL_URL),
    fetchSheet(LIVE_URL),
  ]);

  // ── Process monthly data ─────────────────────────────────────
  let monthlyMode = null;
  let gwBySource  = {};   // also used by sankey below

  if (monthlyResult.status === 'fulfilled') {
    const rows    = monthlyResult.value.rows;
    const lastRow = rows[rows.length - 1];
    const year = lastRow.c[0].v, month = lastRow.c[1].v;
    const daysInMonth  = new Date(year, month + 1, 0).getDate();
    const monthPeriods = daysInMonth * 48;
    const label        = MONTHS_LBL[month] + ' ' + year;

    gwBySource = {};
    FUELS.forEach(f => { gwBySource[f] = (lastRow.c[MC[f]]?.v ?? 0) / monthPeriods / 1000; });
    gwBySource.Other = (lastRow.c[MC.Other]?.v ?? 0) / monthPeriods / 1000;
    const totalGW = (lastRow.c[MC.Total]?.v ?? 0) / monthPeriods / 1000;

    // GWh = stored MW-period sums × 0.5 h / 1000
    const gwhBySource = {};
    FUELS.forEach(f => { gwhBySource[f] = (lastRow.c[MC[f]]?.v ?? 0) / 2000; });
    gwhBySource.Other = (lastRow.c[MC.Other]?.v ?? 0) / 2000;
    const totalGWh = (lastRow.c[MC.Total]?.v ?? 0) / 2000;

    const lowCarbonGW  = FUELS.filter(f => LOW_CARBON.has(f)).reduce((s,f) => s + gwBySource[f], 0);
    const renewableGW  = FUELS.filter(f => RENEWABLE.has(f)).reduce((s,f) => s + gwBySource[f], 0);
    const carbonW      = [...FUELS,'Other'].reduce((s,f) => s + gwBySource[f] * (CARBON_FACTORS[f] ?? 200), 0);
    const lowCarbonPct = totalGW > 0 ? Math.round(lowCarbonGW / totalGW * 100) : 0;
    const renewPct     = totalGW > 0 ? Math.round(renewableGW / totalGW * 100) : 0;
    const carbonInt    = totalGW > 0 ? Math.round(carbonW     / totalGW)       : 0;
    const domesticPct  = totalGW > 0 ? Math.round((totalGW - gwBySource.Gas * 0.4 - gwBySource.Coal * 0.9 - gwBySource.Diesel) / totalGW * 100) : 0;

    const THERM_EFF = { Gas: 0.57, Coal: 0.35, Diesel: 0.35, Wood: 0.39 };
    let thermalInput = 0, thermalLoss = 0;
    Object.entries(THERM_EFF).forEach(([src, eff]) => {
      const gw = gwBySource[src] || 0;
      if (gw > 0) { thermalInput += gw / eff; thermalLoss += gw / eff - gw; }
    });
    const directGW       = totalGW - Object.keys(THERM_EFF).reduce((s,k) => s + (gwBySource[k] || 0), 0);
    const thermalLossPct = (thermalInput + directGW) > 0 ? Math.round(thermalLoss / (thermalInput + directGW) * 100) : 0;

    monthlyMode = { label, gwBySource, gwhBySource, totalGW, totalGWh, lowCarbonPct, renewPct, carbonInt, domesticPct, thermalLossPct };
  }

  // ── Process live (TP) data ───────────────────────────────────
  let liveMode = null;
  if (liveResult.status === 'fulfilled') {
    const rows = liveResult.value.rows;
    if (rows && rows.length > 0) {
      const latest = rows[0];
      const dtFmt  = latest.c[0]?.f ?? String(latest.c[0]?.v ?? '').slice(0, 16);
      const mw = {};
      FUELS.forEach(f => { mw[f] = latest.c[TP_COL[f]]?.v ?? 0; });
      mw.Other = latest.c[TP_COL.Other]?.v ?? 0;
      const totalMW = latest.c[TP_COL.Total]?.v || FUELS.reduce((s,f) => s + mw[f], 0) + mw.Other;

      const lowCarbonMW  = FUELS.filter(f => LOW_CARBON.has(f)).reduce((s,f) => s + mw[f], 0);
      const renewableMW  = FUELS.filter(f => RENEWABLE.has(f)).reduce((s,f) => s + mw[f], 0);
      const carbonW      = [...FUELS,'Other'].reduce((s,f) => s + mw[f] * (CARBON_FACTORS[f] ?? 200), 0);
      const lowCarbonPct = totalMW > 0 ? Math.round(lowCarbonMW / totalMW * 100) : 0;
      const renewPct     = totalMW > 0 ? Math.round(renewableMW  / totalMW * 100) : 0;
      const carbonInt    = totalMW > 0 ? Math.round(carbonW      / totalMW)       : 0;
      const fossilPct    = totalMW > 0 ? Math.round((mw.Gas + mw.Coal) / totalMW * 100) : 0;

      const THERM_EFF_L = { Gas: 0.57, Coal: 0.35, Diesel: 0.35, Wood: 0.39 };
      let tInput = 0, tLoss = 0;
      Object.entries(THERM_EFF_L).forEach(([src, eff]) => {
        const v = mw[src] || 0;
        if (v > 0) { tInput += v / eff; tLoss += v / eff - v; }
      });
      const directMW = totalMW - Object.keys(THERM_EFF_L).reduce((s,k) => s + (mw[k] || 0), 0);
      const thermalLossPct = (tInput + directMW) > 0 ? Math.round(tLoss / (tInput + directMW) * 100) : 0;

      liveMode = { dtFmt, mw, totalMW, lowCarbonPct, renewPct, carbonInt, fossilPct, thermalLossPct };
    }
  }

  // ── Shared chart + render helpers ────────────────────────────
  let mixChart = null;
  let currentTooltipUnit = 'MW';

  function setStatCard(cardId, label, value, unit, cssClass) {
    const card = document.getElementById(cardId);
    if (!card) return;
    card.querySelector('.stat-label').textContent = label;
    card.querySelector('.stat-num span:first-child').textContent = value ?? '—';
    card.querySelector('.stat-unit').textContent = unit;
    card.className = 'stat-card' + (cssClass ? ' ' + cssClass : '');
    card.style.display = '';
  }

  function renderMixChart(fuelsData, totalVal, unit) {
    currentTooltipUnit = unit;
    const allFuels = [...FUELS.filter(f => fuelsData[f] > 0.001), ...(fuelsData.Other > 0.001 ? ['Other'] : [])].sort((a,b) => fuelsData[b] - fuelsData[a]);

    const listEl = document.getElementById('fuel-list');
    listEl.innerHTML = '';
    allFuels.forEach(f => {
      const pct    = totalVal > 0 ? Math.round(fuelsData[f] / totalVal * 100) : 0;
      const valStr = unit === 'GWh' ? `${Math.round(fuelsData[f]).toLocaleString()} GWh`
                   : unit === 'MW'  ? `${Math.round(fuelsData[f])} MW`
                                    : `${fuelsData[f].toFixed(2)} GW`;
      const row = document.createElement('div');
      row.className = 'fuel-row';
      row.innerHTML = `<span class="fuel-dot" style="background:${PALETTE[f]}"></span><span class="fuel-gw">${valStr}</span><span class="fuel-name">${f}</span><div class="fuel-bar-wrap"><div class="fuel-bar" style="width:${pct}%;background:${PALETTE[f]}"></div></div><span class="fuel-pct">${pct}%</span>`;
      listEl.appendChild(row);
    });

    const chartVals = allFuels.map(f => unit === 'GWh' ? Math.round(fuelsData[f]) : unit === 'MW' ? Math.round(fuelsData[f] * 10) / 10 : +fuelsData[f].toFixed(3));
    if (mixChart) {
      mixChart.data.labels = allFuels;
      mixChart.data.datasets[0].data = chartVals;
      mixChart.data.datasets[0].backgroundColor = allFuels.map(f => PALETTE[f]);
      mixChart.update();
    } else {
      mixChart = new Chart(document.getElementById('mix-chart'), {
        type: 'pie',
        data: {
          labels: allFuels,
          datasets: [{ data: chartVals, backgroundColor: allFuels.map(f => PALETTE[f]), borderColor: '#fff', borderWidth: 2, hoverOffset: 8 }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => {
              if (currentTooltipUnit === 'GWh') return ` ${ctx.label}: ${Math.round(ctx.parsed).toLocaleString()} GWh`;
              if (currentTooltipUnit === 'MW')  return ` ${ctx.label}: ${Math.round(ctx.parsed)} MW`;
              return ` ${ctx.label}: ${ctx.parsed.toFixed(2)} GW`;
            }}}
          }
        }
      });
    }
  }

  function renderLive() {
    if (!liveMode) { renderLastMonth(); return; }
    document.getElementById('mix-month-label').textContent = 'Live — as at ' + liveMode.dtFmt;

    const { mw, totalMW, lowCarbonPct, renewPct, carbonInt, fossilPct, thermalLossPct } = liveMode;
    setStatCard('renewables-card',   'Renewables',          renewPct,     '%',         renewPct > 60 ? 'stat-card--low' : renewPct > 40 ? 'stat-card--mid' : 'stat-card--high');
    setStatCard('generation-card',   'Total',               Math.round(totalMW).toLocaleString(), 'MW', 'stat-card--low');
    setStatCard('independence-card', 'Fossil Fuels',        fossilPct,    '%',         fossilPct < 5 ? 'stat-card--low' : fossilPct < 15 ? 'stat-card--mid' : 'stat-card--high');
    setStatCard('carbon-card',       'Carbon Intensity',    carbonInt,    'gCO₂/kWh', carbonInt < 100 ? 'stat-card--low' : carbonInt < 200 ? 'stat-card--mid' : 'stat-card--high');
    setStatCard('thermal-card',      'Thermal Losses',      thermalLossPct, '%',       thermalLossPct < 10 ? 'stat-card--low' : thermalLossPct < 25 ? 'stat-card--mid' : 'stat-card--high');

    renderMixChart(mw, totalMW, 'MW');
  }

  function renderLastMonth() {
    if (!monthlyMode) return;
    const { label, gwhBySource, totalGWh, lowCarbonPct, renewPct, carbonInt, domesticPct, thermalLossPct } = monthlyMode;
    document.getElementById('mix-month-label').textContent = 'Last month — ' + label;

    setStatCard('renewables-card',   'Renewables',               renewPct,       '%',         renewPct > 60 ? 'stat-card--low' : renewPct > 40 ? 'stat-card--mid' : 'stat-card--high');
    setStatCard('generation-card',   'Generation',               Math.round(totalGWh).toLocaleString(), 'GWh', 'stat-card--low');
    setStatCard('independence-card', 'Electricity Independence', domesticPct,    '%',         domesticPct > 80 ? 'stat-card--low' : domesticPct > 60 ? 'stat-card--mid' : 'stat-card--high');
    setStatCard('carbon-card',       'Carbon Intensity',         carbonInt,      'gCO₂/kWh', carbonInt < 100 ? 'stat-card--low' : carbonInt < 200 ? 'stat-card--mid' : 'stat-card--high');
    setStatCard('thermal-card',      'Thermal Losses',           thermalLossPct, '%',         thermalLossPct < 10 ? 'stat-card--low' : thermalLossPct < 25 ? 'stat-card--mid' : 'stat-card--high');

    renderMixChart(gwhBySource, totalGWh, 'GWh');
  }

  // Toggle
  document.querySelectorAll('.mix-toggle .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mix-toggle .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.mode === 'live') renderLive(); else renderLastMonth();
    });
  });

  // Default: live if available, else last month
  if (liveMode) renderLive(); else renderLastMonth();

  // ── Sankey (monthly data only) ────────────────────────────────
  if (monthlyMode && monthlyMode.totalGW > 0) {
    const totalGW = monthlyMode.totalGW;
      const EFF       = { Gas: 0.57, Coal: 0.35, Diesel: 0.35, Geothermal: 0.15, Wood: 0.39 };
      const FUEL_LABEL = { Gas: 'Gas fuel', Coal: 'Coal', Diesel: 'Diesel', Geothermal: 'Geothermal heat', Wood: 'Wood' };
      const GRID_LOSS = 0.06;

      const gw = {
        Gas:          gwBySource['Gas']        || 0,
        Coal:         gwBySource['Coal']       || 0,
        Diesel:       gwBySource['Diesel']     || 0,
        Wind:         gwBySource['Wind']       || 0,
        Solar:        gwBySource['Solar']      || 0,
        Hydro:        gwBySource['Hydro']      || 0,
        Geothermal:   gwBySource['Geothermal'] || 0,
        Wood:         gwBySource['Wood']       || 0,
      };

      const COL = {
        Gas: 'rgba(107,114,128,0.85)',   Coal: 'rgba(17,24,39,0.85)',
        Diesel: 'rgba(156,163,175,0.85)', Wind: 'rgba(13,158,110,0.85)',
        Solar: 'rgba(245,158,11,0.85)',  Hydro: 'rgba(59,130,246,0.85)',
        Geothermal: 'rgba(239,68,68,0.85)', Wood: 'rgba(130,78,26,0.85)',
        Loss: 'rgba(248,113,113,0.75)', Grid: 'rgba(26,77,122,0.85)', Delivered: 'rgba(26,77,122,0.95)',
      };

      const nodeLabels = [], nodeColors = [], nodeX = [], nodeY = [];
      const lSrc = [], lTgt = [], lVal = [], lCol = [];
      let nIdx = 0;
      const addNode = (label, color, x, y) => {
        nodeLabels.push(label); nodeColors.push(color);
        nodeX.push(x); nodeY.push(y);
        return nIdx++;
      };
      const addLink = (s, t, v, c) => {
        if (v > 0.001) { lSrc.push(s); lTgt.push(t); lVal.push(+v.toFixed(3)); lCol.push(c); }
      };

      // Geothermal gets its own discharge node; other thermals share "Thermal losses"
      const combustionFuels = ['Gas','Coal','Diesel','Wood'].filter(n => gw[n] > 0);
      const geoFuels        = ['Geothermal'].filter(n => gw[n] > 0);
      const directSources   = ['Hydro','Wind','Solar'].filter(n => gw[n] > 0);
      const allLeft = [...geoFuels, ...combustionFuels, ...directSources];
      const N = allLeft.length;
      const leftY = allLeft.map((_, i) => N === 1 ? 0.45 : 0.05 + (i / (N - 1)) * 0.85);

      // Left column: geothermal input nodes
      const fuelNodeIdx = {};
      geoFuels.forEach((n, i) => {
        fuelNodeIdx[n] = addNode(FUEL_LABEL[n] || n, COL[n], 0.01, leftY[i]);
      });
      // Left column: combustion fuel inputs
      combustionFuels.forEach((n, i) => {
        fuelNodeIdx[n] = addNode(FUEL_LABEL[n] || n, COL[n], 0.01, leftY[geoFuels.length + i]);
      });

      // Centre column: electricity grid only
      // Left column: direct sources
      const directNodeIdx = {};
      directSources.forEach((n, i) => {
        directNodeIdx[n] = addNode(n, COL[n], 0.01, leftY[geoFuels.length + combustionFuels.length + i]);
      });

      const gridNode = addNode('Electricity grid', COL.Grid, 0.50, 0.60);

      // Right column: outputs — geo heat discharge, thermal losses, grid losses, delivered
      const geoSpareHeat = geoFuels.reduce((s, n) => s + (EFF[n] ? gw[n] / EFF[n] - gw[n] : 0), 0);
      const hasGeoSpare  = geoSpareHeat > 0.001;
      // Geo heat sits at top-right — clearly an output, not a mid-chart intermediate
      const spareHeatNode = hasGeoSpare ? addNode('Geothermal direct heat (not electricity)', 'rgba(239,68,68,0.75)', 0.99, 0.08) : -1;

      let thermalLossTotal = 0;
      combustionFuels.forEach(n => { if (EFF[n]) thermalLossTotal += gw[n] / EFF[n] - gw[n]; });
      const hasThermal    = thermalLossTotal > 0.001;
      const thermalLossNode = hasThermal ? addNode('Thermal losses', COL.Loss, 0.99, 0.28) : -1;

      const lossNode = addNode('Grid transmission loss', COL.Loss,      0.99, hasThermal ? 0.43 : 0.28);
      const delNode  = addNode('Delivered electricity',  COL.Delivered, 0.99, 0.75);

      // Links: geothermal → geo heat (right side) + grid
      geoFuels.forEach(n => {
        const heat = EFF[n] ? gw[n] / EFF[n] - gw[n] : 0;
        if (hasGeoSpare) addLink(fuelNodeIdx[n], spareHeatNode, heat, 'rgba(239,68,68,0.18)');
        addLink(fuelNodeIdx[n], gridNode, gw[n], COL[n].replace('0.85','0.25'));
      });
      // Links: combustion → thermal losses (right side) + grid
      combustionFuels.forEach(n => {
        const heat = EFF[n] ? gw[n] / EFF[n] - gw[n] : 0;
        if (hasThermal) addLink(fuelNodeIdx[n], thermalLossNode, heat, COL.Loss.replace('0.75','0.18'));
        addLink(fuelNodeIdx[n], gridNode, gw[n], COL[n].replace('0.85','0.25'));
      });
      // Links: direct sources → grid
      directSources.forEach(n => {
        addLink(directNodeIdx[n], gridNode, gw[n], COL[n].replace('0.85','0.25'));
      });
      // Links: grid → grid transmission loss + delivered
      addLink(gridNode, lossNode, totalGW * GRID_LOSS,       'rgba(160,175,190,0.25)');
      addLink(gridNode, delNode,  totalGW * (1 - GRID_LOSS), 'rgba(26,77,122,0.22)');

      const sankeyData = { nodeLabels, nodeColors, nodeX, nodeY, lSrc, lTgt, lVal, lCol };

      new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.plot.ly/plotly-2.27.0.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      }).then(() => {
        Plotly.newPlot('sankey-chart', [{
          type: 'sankey',
          orientation: 'h',
          arrangement: 'fixed',
          node: {
            pad: 14, thickness: 20,
            line: { color: '#fff', width: 0.5 },
            label: sankeyData.nodeLabels, color: sankeyData.nodeColors,
            x: sankeyData.nodeX, y: sankeyData.nodeY,
            hovertemplate: '<b>%{label}</b><br>%{value:.2f} GW<extra></extra>',
          },
          link: {
            source: sankeyData.lSrc, target: sankeyData.lTgt,
            value: sankeyData.lVal,  color: sankeyData.lCol,
            hovertemplate: '%{source.label} → %{target.label}<br><b>%{value:.2f} GW</b><extra></extra>',
          },
        }], {
          font: { family: "'DM Sans','Segoe UI',Arial,sans-serif", size: 11.5, color: '#0F172A' },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor:  'rgba(0,0,0,0)',
          margin: { l: 10, r: 10, t: 10, b: 10 },
        }, { responsive: true, displayModeBar: false });
      }).catch(() => {
        const el = document.getElementById('sankey-chart');
        if (el) el.style.display = 'none';
      });
  }

  // ── Carbon intensity history from annual tab ─────────────────
  if (annualResult.status === 'fulfilled') {
    // annual tab: Year(0), Hydro(1), Geo(2), Gas(3), Wind(4), Solar(5), Wood(6), Coal(7), Diesel(8), Other(9), Total(10)
    const AC = { Hydro:1, Geothermal:2, Gas:3, Wind:4, Solar:5, Wood:6, Coal:7, Diesel:8, Other:9, Total:10 };
    const aRows = annualResult.value.rows;
    const years = aRows.map(r => String(Math.round(r.c[0].v)));
    const ciData = aRows.map(r => {
      const total = r.c[AC.Total]?.v ?? 0;
      if (!total) return null;
      return Math.round([...FUELS,'Other'].reduce((s,f) => s + (r.c[AC[f]]?.v ?? 0) * (CARBON_FACTORS[f] ?? 200), 0) / total);
    });

    new Chart(document.getElementById('carbon-chart'), {
      type: 'bar',
      data: {
        labels: years,
        datasets: [{ data: ciData, backgroundColor: '#1a4d7a', borderWidth: 0, categoryPercentage: 0.9, barPercentage: 0.95 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { title: ctx => ctx[0].label, label: ctx => ` ${Math.round(ctx.parsed.y)} gCO₂eq./kWh` } },
        },
        scales: {
          x: { ticks: { font: { family: FONT, size: 11 }, maxRotation: 45, minRotation: 45, autoSkip: false }, grid: { display: false } },
          y: { beginAtZero: true, title: { display: true, text: 'gCO₂eq./kWh', font: { family: FONT, size: 12 }, color: '#555' }, ticks: { font: { family: FONT, size: 11 }, stepSize: 50 }, grid: { color: '#eeeeee' } }
        }
      }
    });
  }
} finally { document.querySelectorAll('.chart-spinner').forEach(el => el.remove()); }
})();

// ── 2030 Countdown ─────────────────────────────────────────────
(function () {
  const TARGET = new Date('2030-12-31T23:59:59Z');

  function tick() {
    const diff = TARGET - Date.now();
    if (diff <= 0) {
      ['cd-years','cd-days','cd-hours','cd-minutes'].forEach(id => {
        document.getElementById(id).textContent = '0';
      });
      return;
    }
    const totalDays = Math.floor(diff / 86400000);
    const years     = Math.floor(totalDays / 365);
    const days      = totalDays % 365;
    const hours     = Math.floor((diff % 86400000) / 3600000);
    const minutes   = Math.floor((diff % 3600000)  / 60000);
    const seconds   = Math.floor((diff % 60000)    / 1000);

    document.getElementById('cd-years').textContent   = years;
    document.getElementById('cd-days').textContent    = days;
    document.getElementById('cd-hours').textContent   = String(hours).padStart(2,'0');
    document.getElementById('cd-minutes').textContent = String(minutes).padStart(2,'0');
    document.getElementById('cd-seconds').textContent = String(seconds).padStart(2,'0');
  }

  tick();
  setInterval(tick, 1000);
})();

// ── Recent generation — monthly stacked bar ───────────────────────
(async () => {
  const FONT = "'DM Sans','Segoe UI',Arial,sans-serif";
  const MONTHS_LBL = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const FUELS = ['Hydro','Geothermal','Gas','Wind','Solar','Wood','Coal','Diesel'];
  const MC = { Hydro:2, Geothermal:3, Gas:4, Wind:5, Solar:6, Wood:7, Coal:8, Diesel:9, Total:11 };
  const PALETTE = {
    Hydro:'#2563eb', Geothermal:'#dc2626', Gas:'#475569', Wind:'#0d9e6e',
    Solar:'#facc15', Wood:'#78350f', Coal:'#0f172a', Diesel:'#94a3b8',
  };

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); } // m is 0-indexed
  function rowLabel(r) { return MONTHS_LBL[r.c[1].v] + ' ' + r.c[0].v; }
  function rowAvgGW(r, f) { return (r.c[MC[f]]?.v ?? 0) / (daysInMonth(r.c[0].v, r.c[1].v) * 48) / 1000; }
  function tail(rows, n) { return rows.slice(-Math.min(n, rows.length)); }

  try {
    const url = 'https://nz.future-zero.com/data/monthly.json';
    const t = await (await fetch(url)).text();
    const rows = JSON.parse(t.slice(t.indexOf('(')+1, t.lastIndexOf(')'))).table.rows;

    function buildDatasets(subset) {
      return FUELS.map(f => ({
        label: f,
        data: subset.map(r => +rowAvgGW(r, f).toFixed(3)),
        backgroundColor: PALETTE[f], borderWidth: 0,
      }));
    }

    const initMonths = window.innerWidth < 768 ? 6 : 12;
    document.querySelectorAll('#week-filter .filter-btn').forEach(b => {
      b.classList.toggle('active', +b.dataset.months === initMonths);
    });
    const initRows = tail(rows, initMonths);
    const weekChart = new Chart(document.getElementById('week-chart'), {
      type: 'bar',
      data: { labels: initRows.map(rowLabel), datasets: buildDatasets(initRows) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { font: { family: FONT, size: 11 }, padding: 12, usePointStyle: true, pointStyle: 'circle', boxWidth: 9, boxHeight: 9 } },
          tooltip: { mode: 'index', callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)} GW` } }
        },
        scales: {
          x: { stacked: true, ticks: { font: { family: FONT, size: 11 } }, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, title: { display: true, text: 'GW', font: { family: FONT, size: 11 }, color: '#555' }, ticks: { font: { family: FONT, size: 10 } }, grid: { color: '#eeeeee' } }
        }
      }
    });

    document.getElementById('week-filter').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('#week-filter .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const n = parseInt(btn.dataset.months, 10);
      const subset = tail(rows, n);
      weekChart.data.labels = subset.map(rowLabel);
      buildDatasets(subset).forEach((ds, i) => { weekChart.data.datasets[i].data = ds.data; });
      weekChart.update();
    });
  } catch (e) { console.error('Recent chart error:', e); }
  finally { document.querySelectorAll('.chart-spinner').forEach(el => el.remove()); }
})();
</script>
