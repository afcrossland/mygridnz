<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Month — MyGridNZ</title>
<meta name="description" content="Aotearoa New Zealand electricity generation last month: half-hourly data by fuel type, carbon intensity and renewable share.">
<!-- Open Graph / social -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://nz.future-zero.com/last-28-days/">
<meta property="og:title"       content="Last Month — MyGridNZ">
<meta property="og:description" content="Aotearoa New Zealand electricity generation last month: half-hourly data by fuel type, carbon intensity and renewable share.">
<meta property="og:image"       content="https://nz.future-zero.com/images/social-preview.png">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Last Month — MyGridNZ">
<meta name="twitter:description" content="Aotearoa New Zealand electricity generation last month: half-hourly data by fuel type, carbon intensity and renewable share.">
<meta name="twitter:image"       content="https://nz.future-zero.com/images/social-preview.png">
<link rel="canonical"            href="https://nz.future-zero.com/last-28-days/">
  
  
<script>
(async () => { try {
  // Static data served from the repo (pushed from Google Sheets by app-scripts/GitHub_push.gs).
  const DATA        = 'https://nz.future-zero.com/data';
  const MONTHLY_URL = `${DATA}/monthly.json`;
  const RECENT_URL  = `${DATA}/recent-halfhourly.json`;   // rolling ~100-day half-hourly window

  const FONT = "'DM Sans','Segoe UI',Arial,sans-serif";
  const MONTHS_LBL = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // data tab:    DateTime(0), Date(1), TP(2), Hydro(3), Geo(4), Gas(5), Wind(6), Solar(7), Wood(8), Coal(9), Diesel(10), Other(11), Total(12)
  // monthly tab: Year(0), Month(1), Hydro(2), Geo(3), Gas(4), Wind(5), Solar(6), Wood(7), Coal(8), Diesel(9), Other(10), Total(11)
  // Stack order (bottom → top): geothermal, wind, solar, hydro, then the rest.
  const FUELS = ['Geothermal','Wind','Solar','Hydro','Gas','Wood','Coal','Diesel'];
  const DC = { Hydro:3, Geothermal:4, Gas:5, Wind:6, Solar:7, Wood:8, Coal:9, Diesel:10, Other:11, Total:12 };
  const MC = { Hydro:2, Geothermal:3, Gas:4, Wind:5, Solar:6, Wood:7, Coal:8, Diesel:9, Other:10, Total:11 };

  const PALETTE = {
    Hydro:'#2563eb', Geothermal:'#dc2626', Gas:'#475569', Wind:'#0d9e6e',
    Solar:'#facc15', Wood:'#78350f', Coal:'#0f172a', Diesel:'#94a3b8',
  };
  const CARBON_FACTORS = {
    Hydro:24, Geothermal:38, Gas:490, Wind:12, Solar:41, Wood:230, Coal:820, Diesel:650, Other:200,
  };

  async function fetchMonthly() {
    const t = await (await fetch(MONTHLY_URL)).text();
    return JSON.parse(t.slice(t.indexOf('(')+1, t.lastIndexOf(')'))).table;
  }

  async function fetchRecent() {
    const t = await (await fetch(RECENT_URL)).text();
    return JSON.parse(t.slice(t.indexOf('(')+1, t.lastIndexOf(')'))).table;
  }

  function parseGDate(s) {
    const m = String(s).match(/Date\((\d+),(\d+),(\d+)\)/);
    return m ? new Date(+m[1], +m[2], +m[3]) : null;
  }

  // 1. Get latest month from monthly sheet
  const monthly = await fetchMonthly();
  const lastRow = monthly.rows[monthly.rows.length - 1];
  const latestYear  = lastRow.c[0].v;
  const latestMonth = lastRow.c[1].v; // 0-indexed from QUERY month()

  // 2. Filter the rolling half-hourly window down to that latest month (client-side).
  const dataTable = await fetchRecent();
  const allRows = (dataTable.rows || []).filter(r => {
    if (r.c[DC.Total]?.v == null) return false;
    const d = parseGDate(r.c[1]?.v);   // column B = Date
    return d && d.getFullYear() === latestYear && d.getMonth() === latestMonth;
  });

  // ── Treemap from monthly averages ─────────────────────────────────
  const days = new Date(latestYear, latestMonth + 1, 0).getDate();
  const periods = days * 48;
  const treeItems = FUELS.map(f => ({
    label: f, source: f,
    value: (lastRow.c[MC[f]]?.v ?? 0) / periods / 1000,
  })).filter(x => x.value > 0.001);

  new Chart(document.getElementById('treemap-chart'), {
    type: 'treemap',
    data: {
      datasets: [{
        tree: treeItems, key: 'value',
        backgroundColor(ctx) {
          if (ctx.type !== 'data') return 'transparent';
          return PALETTE[ctx.raw._data.source] ?? '#9CA3AF';
        },
        borderWidth: 2, borderColor: '#fff',
        labels: {
          display: 'auto',
          formatter(ctx) { const d = ctx.raw._data; return [d.source, d.value.toFixed(2)+' GW']; },
          color: '#fff',
          font(ctx) {
            const w = ctx.raw?.w ?? 40, h = ctx.raw?.h ?? 20;
            const size = Math.max(8, Math.min(15, Math.sqrt(w * h) / 7));
            return { family: FONT, size, weight: '600' };
          },
          padding: 6,
        },
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { title: ctx => ctx[0]?.raw?._data?.source ?? '', label: ctx => ` ${ctx.raw._data.value.toFixed(2)} GW avg` } }
      }
    }
  });

  // ── Stacked area (half-hourly MW) ─────────────────────────────────
  function rowLabel(r) {
    const d = parseGDate(r.c[1].v);
    const tp = r.c[2].v;
    if (!d) return '';
    const mins = (tp - 1) * 30;
    return d.getDate() + ' ' + MONTHS_LBL[d.getMonth()] + ' ' + String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins%60).padStart(2,'0');
  }

  function genLabels(rows) { return rows.map(rowLabel); }
  function genDatasets(rows) {
    return FUELS.map(f => ({
      label: f,
      data: rows.map(r => +(r.c[DC[f]]?.v ?? 0).toFixed(0)),
      backgroundColor: PALETTE[f], borderColor: PALETTE[f],
      borderWidth: 0.5, fill: true, pointRadius: 0, tension: 0.2,
    }));
  }

  // Returns a tick callback showing DD-MM at day boundaries, every everyNDays days.
  function makeDayTickCb(rows, everyNDays) {
    let dayCount = 0, lastKey = '';
    const ticks = rows.map(r => {
      const d = parseGDate(r.c[1].v);
      if (!d) return '';
      const key = d.toDateString();
      if (key !== lastKey) {
        lastKey = key; dayCount++;
        if ((dayCount - 1) % everyNDays === 0)
          return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`;
      }
      return '';
    });
    return (_, idx) => ticks[idx] ?? '';
  }

  const nDays = window.innerWidth < 768 ? 3 : 1;
  const initLabels = genLabels(allRows);
  const genChart = new Chart(document.getElementById('gen-chart'), {
    type: 'line',
    data: { labels: initLabels, datasets: genDatasets(allRows) },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { font: { family: FONT, size: 12 }, padding: 16, usePointStyle: true, pointStyle: 'circle', boxWidth: 10, boxHeight: 10 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(0)+' MW' : '—'}` } }
      },
      scales: {
        x: { stacked: true, ticks: { font: { family: FONT, size: 10 }, maxRotation: 45, minRotation: 0, autoSkip: false, callback: makeDayTickCb(allRows, nDays) }, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, min: 0, title: { display: true, text: 'Power, MW', font: { family: FONT, size: 12 }, color: '#555' }, ticks: { font: { family: FONT, size: 11 } }, grid: { color: '#eeeeee' } }
      }
    }
  });

  document.getElementById('gen-filter').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('#gen-filter .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const n = parseInt(btn.dataset.periods, 10);
    const rows = n > 0 ? allRows.slice(-n) : allRows;
    const lbls = genLabels(rows);
    genChart.data.labels = genLabels(rows);
    genDatasets(rows).forEach((ds, i) => { genChart.data.datasets[i].data = ds.data; });
    genChart.options.scales.x.ticks.callback = makeDayTickCb(rows, window.innerWidth < 768 ? 3 : 1);
    genChart.update('none');
  });

  // ── Carbon intensity line ─────────────────────────────────────────
  const ciData = allRows.map(r => {
    const total = r.c[DC.Total]?.v ?? 0;
    if (!total) return null;
    return +([...FUELS,'Other'].reduce((s,f) => s + (r.c[DC[f]]?.v ?? 0) * (CARBON_FACTORS[f] ?? 200), 0) / total).toFixed(1);
  });
  new Chart(document.getElementById('carbon-intensity-chart'), {
    type: 'line',
    data: {
      labels: genLabels(allRows),
      datasets: [{ label: 'Carbon intensity', data: ciData, borderColor: '#1a4d7a', backgroundColor: 'rgba(26,77,122,0.08)', borderWidth: 1.5, fill: true, pointRadius: 0, tension: 0.2 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${Math.round(ctx.parsed.y)} gCO₂eq/kWh` } },
        annotation: {
          annotations: {
            target: { type: 'line', yMin: 50, yMax: 50, borderColor: '#ef4444', borderWidth: 2,
              label: { display: true, content: '50 gCO₂ target', position: 'end', yAdjust: -14, backgroundColor: 'transparent', color: '#ef4444', font: { family: FONT, size: 13, weight: '600' }, padding: 0 } }
          }
        }
      },
      scales: {
        x: { ticks: { font: { family: FONT, size: 10 }, maxRotation: 45, minRotation: 0, autoSkip: false, callback: makeDayTickCb(allRows, window.innerWidth < 768 ? 3 : 1) }, grid: { display: false } },
        y: { beginAtZero: true, title: { display: true, text: 'gCO₂eq/kWh', font: { family: FONT, size: 12 }, color: '#555' }, ticks: { font: { family: FONT, size: 11 } }, grid: { color: '#eeeeee' } }
      }
    }
  });
} finally { document.querySelectorAll('.chart-spinner').forEach(el => el.remove()); }
})();
</script>

</body>
</html>
